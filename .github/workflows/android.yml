name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Accept SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install SDK platform for compileSdk 37
        continue-on-error: true
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --list_installed | tail -20 || true
          "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;37.0.0" || true
          "$SDKMANAGER" --list_installed | grep -i "android-37" || true

      - name: Gradle info
        run: gradle --version

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="app/build.gradle.kts"
          DEFAULT_CODE="$(sed -nE 's/^[[:space:]]*val[[:space:]]+defaultVersionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$BUILD_FILE" | head -n1)"
          DEFAULT_NAME="$(sed -nE 's/^[[:space:]]*val[[:space:]]+defaultVersionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$BUILD_FILE" | head -n1)"

          if [[ -z "$DEFAULT_CODE" || -z "$DEFAULT_NAME" ]]; then
            echo "无法从 $BUILD_FILE 读取默认版本号" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$DEFAULT_NAME"
          fi
          VERSION_CODE="$((DEFAULT_CODE + GITHUB_RUN_NUMBER))"

          sed -i -E \
            -e "s/^version=.*/version=${VERSION_NAME}/" \
            -e "s/^versionCode=.*/versionCode=${VERSION_CODE}/" \
            app/src/main/resources/META-INF/xposed/module.prop

          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: UI consistency gate
        run: bash tools/check-ui-consistency.sh

      # 单测门禁：CSV 解析器（动态表头定位、金额防护、编码探测、去重键）
      # 是本项目最容易静默回归的一块，任何改动都必须先过这里。
      - name: Unit tests
        env:
          AUTO_LEDGER_VERSION_CODE: ${{ steps.version.outputs.code }}
          AUTO_LEDGER_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug
        env:
          AUTO_LEDGER_VERSION_CODE: ${{ steps.version.outputs.code }}
          AUTO_LEDGER_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release
        env:
          AUTO_LEDGER_VERSION_CODE: ${{ steps.version.outputs.code }}
          AUTO_LEDGER_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: >-
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload CI APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AutoLedger-${{ steps.version.outputs.name }}-ci-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Stage release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk \
            "dist/AutoLedger-${{ steps.version.outputs.name }}-release.apk"
          sha256sum dist/*.apk

      - name: Prepare GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.name }}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ steps.version.outputs.name }}" == "1.0.0" ]]; then
            echo "title=AutoLedger v1.0.0 正式版" >> "$GITHUB_OUTPUT"
          else
            echo "title=AutoLedger v${{ steps.version.outputs.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.title }}
          files: dist/*.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            **/build/**/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
